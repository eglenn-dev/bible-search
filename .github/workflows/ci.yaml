name: CI

# Run checks when a PR is opened and on every new push to the PR branch.
# `synchronize` fires on pushes to the head branch; `reopened` covers
# re-opened PRs.
on:
    pull_request:
        types: [opened, synchronize, reopened]

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend:
        name: Frontend lint & build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./client
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: "npm"
                  cache-dependency-path: "./client/package-lock.json"
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
              env:
                  VITE_API_DOMAIN: ${{ secrets.VITE_API_DOMAIN }}

    backend:
        name: Backend lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./api
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up uv
              uses: astral-sh/setup-uv@v8
              with:
                  python-version: "3.11"
            - name: Lint
              run: uvx ruff check .
