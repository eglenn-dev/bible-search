[project]
name = "gospel-library-search"
version = "0.1.0"
description = "Semantic search API over the Bible, General Conference, and the General Handbook."
requires-python = ">=3.11.5,<3.13"
dependencies = [
    # Web stack: relaxed to ranges so FastMCP can co-resolve a compatible set.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "fastmcp>=3.4.10,<4", # hosts the MCP server (Streamable HTTP, auto-generated from this app)
    "slowapi>=0.1.9",      # per-IP rate limiting
    "pymongo>=4.18.3,<5",  # includes dnspython, so mongodb+srv:// Atlas URIs work
    # Embedding: ONNX runtime + the repo's tokenizer.json (no torch, no
    # transformers). Encodes queries at runtime and passages at ingest time.
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "beautifulsoup4==4.12.3",
    "requests>=2.33.0,<3",
    "python-dotenv>=1.0.1",
    "anthropic>=2.3.0",    # Ask mode (Claude Haiku 5.5); see ask.py
]

# This is an application, not an installable package — uv manages only the deps.
[tool.uv]
package = false

[tool.ruff]
# Exploratory Jupyter notebooks under data/ are not part of the application source.
extend-exclude = ["data"]
