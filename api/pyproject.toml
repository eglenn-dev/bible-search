[project]
name = "gospel-library-search"
version = "0.1.0"
description = "Semantic search API over the Bible, General Conference, and the General Handbook."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pymongo==4.10.1",  # includes dnspython, so mongodb+srv:// Atlas URIs work
    "sentence-transformers==3.3.0",
    "numpy<2.0.0",
    "torch==2.5.1",
    "transformers==4.46.2",
    "beautifulsoup4==4.12.3",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]

# This is an application, not an installable package — uv manages only the deps.
[tool.uv]
package = false
