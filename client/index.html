  <!-- Paint the saved theme before first paint so a dark-mode load never
       flashes the light palette. Mirrors src/lib/theme.ts; keep the storage
       key ("gs-theme") and the default ("system") in sync with it. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("gs-theme");
        var theme = saved === "light" || saved === "dark" ? saved : "system";
        var dark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        /* storage unavailable — the ThemeProvider re-applies on mount */
      }
    })();
  </script>
</head>
